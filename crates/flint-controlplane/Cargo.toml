[package]
name = "flint-controlplane"
description = "v1 global control plane: durable tenant registry (tokens, namespaces, shuffle-shard proxy subsets) + group topology, versioned snapshot push to proxies with ACK; openraft HA (Raft-replicated durable intent)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flint-resp = { path = "../flint-resp" }
flint-tls = { path = "../flint-tls" }
flint-journal = { path = "../flint-journal" }
openraft = { version = "0.9", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
# Async TLS for the tokio paths (Raft RPC + HA client port); reuses the
# rustls configs flint-tls builds.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
