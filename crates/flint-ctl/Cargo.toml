[package]
name = "flint-ctl"
description = "flintctl: inventory-driven cluster lifecycle — bootstrap a whole cluster (certs, control plane, pairs, proxies, controller, agent) from one file, then status / tenant / expand / swap-bad-node / stop. v1 runs local processes; a remote runner slots in behind the same command surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flintctl"
path = "src/main.rs"

[dependencies]
flint-build = { path = "../flint-build" }
flint-journal = { path = "../flint-journal" }
flint-resp = { path = "../flint-resp" }
# The slot hash + default owner, so `verify --probe` can cover EVERY pair
# instead of whichever one its single key happened to hash to (#170). Same
# crate the proxy routes with, so the probe cannot drift from real routing.
flint-slot = { path = "../flint-slot" }
flint-tls = { path = "../flint-tls" }

[lints]
workspace = true
