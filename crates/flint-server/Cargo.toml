[package]
name = "flint-server"
description = "Flint data-plane node (v0: single-node RESP string server)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For `_exit` on the crash path only — see hard_exit() in main.rs. Already in
# the tree transitively (flint-storage pulls it); this makes it explicit
# because a direct call deserves a direct dependency.
libc = "0.2"
flint-build = { path = "../flint-build" }
flint-resp = { path = "../flint-resp" }
flint-commands = { path = "../flint-commands" }
flint-slot = { path = "../flint-slot" }
flint-storage = { path = "../flint-storage" }
flint-tls = { path = "../flint-tls" }
flint-journal = { path = "../flint-journal" }
# JSON document type: parsing/path resolution live in the command layer
# (storage stores opaque bytes). Already in the tree via flint-journal.
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[features]
rocks = ["flint-storage/rocksdb"]
