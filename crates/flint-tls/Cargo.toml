[package]
name = "flint-tls"
description = "Internal-mesh mutual TLS: shared config builders (client-cert-verifying server, cert-presenting client) over a common internal CA, plus plain-or-TLS stream wrappers reused across every internal hop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ring = "0.17"
# `ring` provider = pure-Rust build (no C toolchain); pinned explicitly, not
# via the process-default provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
x509-parser = "0.18.1"
# Async stream helpers (ADR-0021), feature-gated so the many blocking
# consumers of this crate — server, controller, ctl, chaos — do not pull a
# runtime they never enter. Same rustls 0.23 / ring provider as above, and the
# same tokio-rustls major flint-controlplane already runs.
tokio = { version = "1", features = ["net", "io-util", "time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

[features]
# Async counterparts of the stream helpers. Enabled by flint-proxy.
aio = ["dep:tokio", "dep:tokio-rustls"]

[dev-dependencies]
# In-test CA + leaf minting for the drain_read deadlock regression test —
# same ring backend as the runtime stack, no extra toolchain.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# The async duplex test needs a runtime to drive; only ever a dev dependency.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }

[lints]
workspace = true
