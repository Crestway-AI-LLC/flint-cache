[package]
name = "flint-backup"
description = "The backup ARTIFACT (ADR-0011): what a backup set contains, and whether it is intact. A library, because a format with two implementations has two formats — the flint-backup seat writes sets with it and restore reads them with it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flint-backup"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# sha256_stream_hex. No object-store SDK here, deliberately: this crate is
# the FORMAT, and the format must be testable — and restorable — without
# credentials or a network. The SDK lives behind ObjectStore in the seat.
flint-tls = { path = "../flint-tls" }
# The S3 store's SigV4 chain. Already in the tree via flint-tls; taking it
# directly beats re-exporting hmac through a TLS crate's public surface.
ring = "0.17"
# The seat only. Kept out of the library's own surface so a caller that just
# reads a set — a restore, a test — links no RESP client and no build stamp.
flint-resp = { path = "../flint-resp" }
flint-build = { path = "../flint-build" }
flint-sched = { path = "../flint-sched" }
# restore only (feature `rocks`, mirroring flint-server): the D4 scrub opens
# the restored checkpoint to rewrite system rows, which needs the engine.
flint-storage = { path = "../flint-storage", optional = true }
# restore-ns routing: the same default_pair the proxy routes by, so the
# restore and the router cannot disagree about ownership.
flint-slot = { path = "../flint-slot", optional = true }

[features]
rocks = ["dep:flint-storage", "flint-storage/rocksdb", "dep:flint-slot"]
