name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - run: cargo test --workspace
  # The rocks engine is the production configuration; without this leg the
  # entire cfg(feature = "rocks") surface (replication, full sync, the async
  # write queue, manifests) would merge unchecked. It compiles RocksDB
  # (~25 min cold), so it runs on PULL REQUESTS only — the merge gate holds,
  # while direct pushes to main spend only the cheap mem-config job.
  # Runs on push too, not only pull_request. This job covers the RocksDB
  # feature configuration — the storage engine that actually ships — and
  # work lands here by pushing to main, so gating it on pull_request meant
  # the release checklist claimed a coverage the normal flow never ran.
  # It costs ~90s with a warm cache; there was no saving worth that gap.
  check-rocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rocks
      - run: cargo clippy --workspace --all-targets --features flint-server/rocks,flint-backup/rocks --keep-going -- -D warnings
      # NOTHING RAN cargo doc FOR THIS REPO UNTIL 2026-09-19, and nineteen
      # errors had accumulated behind that on a green main: one genuinely
      # broken intra-doc link, and eighteen command signatures written as
      # prose -- `FLINTSNAPSHOT <root>` -- where rustdoc reads <root> as an
      # unclosed HTML tag. They were invisible because neither these
      # workflows nor the gate box documented anything.
      #
      # IT RUNS IN THE ROCKS JOB because that surface is a superset: the
      # cfg(feature = "rocks") code carries doc comments the mem-config job
      # never compiles, and the broken link that started this was in one.
      #
      # If this leg reddens on a doc comment you just wrote, the usual cause
      # is a <placeholder> in prose. Wrap the signature in backticks -- it
      # reads the same and rustdoc stops parsing it as markup.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --features flint-server/rocks,flint-backup/rocks
      - run: cargo test --workspace --features flint-server/rocks,flint-backup/rocks
