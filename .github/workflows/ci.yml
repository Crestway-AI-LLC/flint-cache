name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # The rocks engine is the production configuration; without this leg the
  # entire cfg(feature = "rocks") surface (replication, full sync, the async
  # write queue, manifests) would merge unchecked.
  check-rocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rocks
      - run: cargo clippy --workspace --all-targets --features flint-server/rocks -- -D warnings
      - run: cargo test --workspace --features flint-server/rocks
