# SPDX-License-Identifier: Elastic-2.0
#
# Push a tag (v*) and this publishes the artifact a self-hoster actually
# wants: a versioned Linux binary bundle plus manifest.json —
#
#   { version, bundle, sha256, format_break, commit, built_at }
#
# Why this exists at all: flintctl refuses the fleet-CHANGING verbs from a
# binary that is not a release, because such a binary carries no manifest, no
# checksum and no version anyone can check. Before this workflow the only ways
# to satisfy that guard were `disposable on` (which means "this fleet is
# throwaway") or stamping your own build. Neither is what you want to hand an
# evaluator, and the refusal message used to advise "deploy a release bundle"
# when this repository published none.
#
# A format break is declared by a LINE STARTING WITH `format-break` in the
# tag's annotation; `flintctl upgrade --manifest` then refuses the canary fast
# path, because a format break cannot roll back and belongs in the migration
# runbook instead.
#
# The build runs INSIDE an Amazon Linux 2023 container on purpose. A bundle
# built on the Ubuntu runner links a newer glibc and will not start on older
# hosts — rc.3's did exactly that, GLIBC_2.39 not found. Building against an
# older glibc makes compatibility structural rather than lucky. AL2023 is
# glibc 2.34, so the bundle runs on RHEL 9, Amazon Linux 2023, Ubuntu 22.04
# and newer; older hosts (RHEL 8, glibc 2.28) should build from source.
name: release
on:
  push:
    tags: ["v*"]
  # Build a bundle from any commit WITHOUT tagging: artifact only, no release,
  # no version number spent. The publish job is gated on the ref being a tag,
  # so a dispatch run builds and stops.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    env:
      # ONE definition of what this build is, used by the compile stamp, the
      # bundle name and the manifest. GITHUB_REF_NAME is the TAG on a tag push
      # and the BRANCH on a dispatch, so using it directly would produce
      # `flint-main-linux-x86_64.tar.gz` announcing itself as version "main".
      FLINT_STAMP: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-dev+{0}', github.sha) }}
    steps:
      - name: Toolchain deps (AL2023)
        run: |
          dnf -y install git openssh-clients gcc gcc-c++ make cmake \
            clang clang-libs clang-devel tar gzip findutils which perl-core
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Gates (rocks — the production engine configuration)
        run: cargo test --workspace --features flint-server/rocks,flint-backup/rocks

      - name: Build release binaries
        # FLINT_RELEASE_TAG is baked in at COMPILE time so every binary reports
        # its own version whoever starts it — flintctl, systemd, or a hand
        # restart — and `verify` can hold a fleet to one build.
        #
        # rust-cache carries target/ between runs, which is exactly why
        # flint-build's build.rs declares rerun-if-env-changed for this
        # variable: a warm cache would otherwise re-ship the PREVIOUS tag's
        # stamp without recompiling.
        env:
          # A dispatch build is NOT a release and must not claim to be one.
          # Stamping it 0.0.0-dev+<sha> keeps it identifiable while flintctl's
          # release check still refuses it the fleet-mutating verbs.
          FLINT_RELEASE_TAG: ${{ env.FLINT_STAMP }}
        run: |
          cargo build --release --workspace --features flint-server/rocks,flint-backup/rocks
          # Assert the stamp actually LANDED, by asking the binaries rather
          # than trusting the build. A release that misreports its version
          # fails verify on every fleet that installs it, and it would read as
          # a bad deploy rather than a bad build.
          for b in flint-server flintctl; do
            GOT="$(./target/release/$b --build-version)"
            if [ "$GOT" != "$FLINT_RELEASE_TAG" ]; then
              echo "$b reports build '$GOT', expected '$FLINT_RELEASE_TAG' — the stamp did not land"
              exit 1
            fi
            echo "  $b stamp OK: $GOT"
          done

      - name: Assemble bundle + manifest
        run: |
          set -euo pipefail
          TAG="${FLINT_STAMP}"
          BUNDLE="flint-${TAG}-linux-x86_64.tar.gz"
          mkdir -p bundle out
          for b in flint-server flint-proxy flint-controller flint-controlplane \
                   flintctl flint-conformance flint-bench flint-chaos flint-exporter; do
            cp "target/release/$b" bundle/
          done
          tar czf "out/$BUNDLE" -C bundle .
          SHA=$(sha256sum "out/$BUNDLE" | cut -d' ' -f1)
          # Read the ANNOTATED tag object: checkout leaves a peeled, lightweight
          # ref whose %(contents) would be the commit message. A dispatch build
          # declares no format break because it declares nothing — it is not a
          # release.
          git config --global --add safe.directory "$PWD"
          MSG=""
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            MSG=$(git fetch --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}" --force \
              && (git cat-file tag "refs/tags/${TAG}" 2>/dev/null | sed '1,/^$/d' || true))
          fi
          if echo "$MSG" | grep -qiE '^[[:space:]]*format-break'; then FB=true; else FB=false; fi
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${BUNDLE}"
          else
            BUNDLE_URL="ci-artifact://${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          cat > out/manifest.json <<EOF
          {
            "version": "${TAG}",
            "bundle": "${BUNDLE_URL}",
            "sha256": "${SHA}",
            "format_break": ${FB},
            "commit": "$(git rev-parse HEAD)",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat out/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: out/
          retention-days: 3

  publish:
    needs: build
    # Only a TAG publishes. A workflow_dispatch run produces the artifact and
    # stops there — that is the whole point of having it.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST and into a subdirectory. actions/checkout cleans its
      # working directory, so running it after download-artifact would delete
      # the very bundle we are about to publish.
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Sign the bundle and the manifest (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        # WHY, in one line: the sha256 in manifest.json proves the tarball
        # matches THAT MANIFEST, and anyone who can swap the tarball can swap
        # the manifest beside it. A signature proves the bytes came from this
        # pipeline no matter which mirror, CDN or USB stick delivered them.
        #
        # FAIL CLOSED. If the key or the published public key is missing this
        # stops the release rather than shipping unsigned artifacts quietly —
        # an unsigned release that looks like every other release is worse
        # than a failed one, because nobody finds out until they need it.
        run: |
          set -euo pipefail
          trap 'rm -f sk.key' EXIT
          if [ ! -f repo/minisign.pub ]; then
            echo "no repo/minisign.pub — the release signing key has not been set up."
            echo "See docs/release-signing.md for the two commands that create it."
            exit 1
          fi
          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "secret MINISIGN_SECRET_KEY is not set on this repository."
            echo "See docs/release-signing.md."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          printf '%s\n' "$MINISIGN_KEY" > sk.key
          chmod 600 sk.key
          BUNDLE=$(ls flint-*.tar.gz)
          for f in "$BUNDLE" manifest.json; do
            # -t is the TRUSTED comment: it is covered by the signature, so it
            # cannot be edited after the fact the way the untrusted one can.
            minisign -S -s sk.key -m "$f" -t "flint ${GITHUB_REF_NAME} — $f"
          done
          # Verify against the key we PUBLISH, not merely the one we hold. If
          # the CI secret ever drifts from the committed public key, every
          # signature would be unverifiable by users and nothing else would
          # notice. This is the assert that makes the signing meaningful.
          PUB=$(tail -1 repo/minisign.pub)
          for f in "$BUNDLE" manifest.json; do
            minisign -V -P "$PUB" -m "$f"
          done
          echo "signed and verified against the published key: $BUNDLE, manifest.json"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes go through a FILE, not `--notes "$(cat <<EOF ...)"`. A
        # heredoc body has to start at column 0 for the shell, and a line less
        # indented than a YAML block scalar ends the block — so the inline
        # form silently truncates the workflow itself. Written this way the
        # whole heredoc is indented with the block, YAML strips that
        # indentation, and the shell sees a normal column-0 heredoc.
        run: |
          V="${GITHUB_REF_NAME}"
          cat > notes.md <<NOTES
          Linux x86_64 binaries, built on Amazon Linux 2023 (glibc 2.34) — so they
          run on RHEL 9, Amazon Linux 2023, Ubuntu 22.04 and newer. On older hosts
          (RHEL 8 and friends, glibc 2.28) build from source instead; the README
          lists what that needs.

          **Verify before you unpack.** The signature is what proves these
          bytes came from the Flint release pipeline — a checksum alone only
          proves the tarball matches the manifest shipped beside it, and
          whoever can replace one can replace the other.

              minisign -Vm flint-${V}-linux-x86_64.tar.gz \\
                -P \$(tail -1 minisign.pub)

          \`minisign.pub\` lives in the repository root, so you can pin it once
          out of band and check every future release against it. The checksum
          is still there if you want it:

              sha256sum flint-${V}-linux-x86_64.tar.gz
              jq -r .sha256 manifest.json

          **Install**

              tar xzf flint-${V}-linux-x86_64.tar.gz -C /opt/flint/bin

          Point your inventory's \`bins\` at that directory. These binaries carry
          the release stamp, so \`flintctl\` will operate a real fleet with them —
          no \`disposable on\` required. \`docs/self-hosting.md\` is the guide.

          **Upgrading a running fleet**

              flintctl -f <inventory> push-bins flint-${V}-linux-x86_64.tar.gz
              flintctl -f <inventory> upgrade --manifest manifest.json --version-tag ${V}

          That rolls a canary replica first, soaks it, then the remaining
          replicas, and the masters last.
          NOTES
          # minisign.pub ships WITH the release as well as living in the repo:
          # someone who only ever sees the assets can still pin the key, and
          # the two copies being identical is checkable.
          gh release create "$V" \
            flint-*.tar.gz flint-*.tar.gz.minisig \
            manifest.json manifest.json.minisig \
            repo/minisign.pub \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Flint $V" \
            --notes-file notes.md
