[workspace]
resolver = "2"
members = [
    "crates/flint-build",
    "crates/flint-slot",
    "crates/flint-resp",
    "crates/flint-commands",
    "crates/flint-tls",
    "crates/flint-storage",
    "crates/flint-server",
    "crates/flint-conformance",
    "crates/flint-bench",
    "crates/flint-chaos",
    "crates/flint-balance",
    "crates/flint-controller",
    "crates/flint-proxy",
    "crates/flint-controlplane",
    "crates/flint-journal",
    "crates/flint-ctl",
    "crates/flint-exporter",
]
default-members = [
    "crates/flint-build",
    "crates/flint-slot",
    "crates/flint-resp",
    "crates/flint-commands",
    "crates/flint-tls",
    "crates/flint-storage",
    "crates/flint-server",
    "crates/flint-conformance",
    "crates/flint-balance",
    "crates/flint-controller",
    "crates/flint-proxy",
    "crates/flint-controlplane",
    "crates/flint-journal",
    "crates/flint-ctl",
    "crates/flint-exporter",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# Edition 2024 needs 1.85. Stated so that a distro toolchain fails with
# "requires rustc 1.85 or newer" instead of an opaque edition error — the
# first thing a self-hoster on RHEL or Debian stable would have hit.
# CI and development run stable (1.96 at time of writing); anything between
# 1.85 and that is permitted by cargo but not exercised by us.
rust-version = "1.85"
license = "Elastic-2.0"
repository = "https://github.com/Crestway-AI-LLC/flint-cache"
# These crates are the product, not libraries for crates.io. Elastic-2.0 is
# not an OSI licence and none of this is meant to be depended on by name, so
# a stray `cargo publish` from the workspace should fail closed.
publish = false

[workspace.lints.clippy]
unwrap_used = "warn"
